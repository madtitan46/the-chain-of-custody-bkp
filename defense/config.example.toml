# Copy to config.toml. Never commit config.toml or anything under data/.
# One config.toml = one platform profile. Same defence code for every platform.
[profile]
name = "example-platform"   # label for humans only
event_types = []            # optional allow-list; empty = any snake_case event_type

[node]
node_id = "node-1"

[paths]
spool_path = "spool/events.jsonl"
db_path = "data/sidecar.db"
private_key_path = "data/node1.key"
public_key_path = "data/node1.pub"

[checkpoint]
every_n = 50
every_s = 60

[heartbeat]
interval_s = 30
witness_url = "http://localhost:8800"

[witness]
db_path = "data/witness.db"
port = 8800
# map of node_id -> hex public key the witness trusts
nodes_file = "data/witness_nodes.toml"
